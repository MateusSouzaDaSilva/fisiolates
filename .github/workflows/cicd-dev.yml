name: Build and Push Docker image to AWS ECR

on:
  push:
    branches:
      - development

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # Necessary to fetch all tags and history
    
################################################################
###               SONAR CLOUD SCAN                           ###
### Drops the build if any bugs or vulnerabilities are found.###
###            Using the default quality gate.               ###
###        Connected to my personal Sonar Cloud account      ###
################################################################

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'

################################################################
###               TERRAFORM                                  ###
################################################################

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Terraform Init
      if: vars.INFRA_PROVISIONED != 'true'
      run: terraform init
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Plan
      if: vars.INFRA_PROVISIONED != 'true'
      run: terraform plan -out=tfplan -var="fisiolates-aws-key=fisiolates-aws-key"
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Apply
      if: vars.INFRA_PROVISIONED != 'true'
      run: terraform apply -auto-approve tfplan
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Mark Infrastructure as Provisioned
      if: vars.INFRA_PROVISIONED != 'true'
      run: |
        echo "INFRA_PROVISIONED=true" >> $GITHUB_ENV
        # Opcional: Atualizar variável no repositório via API do GitHub
        # curl -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
        #   -d '{"name":"INFRA_PROVISIONED","value":"true"}' \
        #   https://api.github.com/repos/${{ github.repository }}/actions/variables/INFRA_PROVISIONED

    # - name: Terraform refresh
    #   run: terraform refresh
    #   working-directory: ./terraform
    
    - name: Get Terraform Outputs
      id: tf_outputs
      run: |
        cd terraform
        IP_REGEX='[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
        EC2_IP=$(terraform output -raw ec2_public_ip | grep -oE "$IP_REGEX" | tail -n 1)

        ECR_REGEX='[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-zA-Z0-9._-]+'
        ECR_REPO=$(terraform output -raw ecr_url | grep -oE "$ECR_REGEX" | tail -n 1)

        # Log para verificação dos valores filtrados
        echo "=========================================="
        echo "== IP Filtrado: $EC2_IP =="
        echo "== ECR Filtrado: $ECR_REPO =="
        echo "=========================================="
        echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
        echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT

################################################################
###               DETERMINE NEXT VERSION                     ###
###   Used for creating new releases and image tags          ###
################################################################

    - name: Determine Next Version
      id: next_version
      run: |
        # Fetch all tags
        git fetch --tags
        
        # Get the latest tag, assume semver, and sort.
        LATEST_TAG=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
        
        # If there's no tag yet, start with v0.0.0. Used for new repos
        if [ -z "$LATEST_TAG" ]; then
          LATEST_TAG="v0.0.0"
        fi
        
        # Increment the patch version
        NEXT_TAG=$(echo $LATEST_TAG | awk -F. '{print $1"."$2"."$3+1}')
        
        # Output the next version
        echo "::set-output name=tag::$NEXT_TAG"
        echo "Next version: $NEXT_TAG"

################################################################
###                     CREATE RELEASE                       ###
###  Creating release with the tag from the previous step    ###
################################################################

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN_2 }}
      with:
        tag_name: ${{ steps.next_version.outputs.tag }}
        release_name: Release ${{ steps.next_version.outputs.tag }}
        draft: false
        prerelease: false

################################################################
###                  BUILD DOCKER IMAGE                      ###
###         Build Docker image from the Dockefile            ###
################################################################

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Extract repository name
      id: repo-name
      run: |
        REPO_NAME="${GITHUB_REPOSITORY##*/}"
        echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
        echo "::set-output name=repo_name::$REPO_NAME"

    - name: Set variables
      id: vars
      run: |
        echo "${{ vars.ENV_DEV }}" > .env

    - name: Build Docker image      
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.REPO_NAME }}
        IMAGE_TAG: ${{ steps.next_version.outputs.tag }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        echo "IMAGE_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

###########################################################
###  Docker image Snyk scan | If fails, drop the action ###
###       Connected to my personal Snyk account         ###
###     The code owner receives an email notification   ###
### Possible to configure Slack notification if needed  ###
###########################################################               
               
    # - name: Run Snyk to check Docker image for vulnerabilities
    #   uses: snyk/actions/docker@master
    #   env:
    #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    #   with:
    #      image: ${{ env.IMAGE_NAME }}
    #      args: --severity-threshold=high --policy-path=.snyk
    #   continue-on-error: false

###########################################################
###                  PUSH IMAGE TO ECR                  ###
###     Tag Docker image as "latest" and push to ECR    ###
########################################################### 

    - name: Push Docker image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fisiolates
        IMAGE_TAG: ${{ steps.next_version.outputs.tag }}
      run: |
        # Tag the image as latest
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        # Push the specific version tag
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        # Push the latest tag
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Install Docker and AWS CLI on EC2
      env:
        EC2_PEM_KEY: ${{ secrets.EC2_PEM_KEY }}
        EC2_HOST: ${{ steps.tf_outputs.outputs.ec2_ip }}
        EC2_USER: ${{ secrets.EC2_USER }}
      run: |
        # Salva a chave PEM temporariamente
        echo "$EC2_PEM_KEY" > ec2.pem
        chmod 400 ec2.pem

        # Define o comando SSH com keep-alive para evitar desconexões
        SSH_COMMAND="ssh -i ec2.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 $EC2_USER@$EC2_HOST"

        # Configura o debconf para modo não interativo
        $SSH_COMMAND "echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections"

        # Atualiza pacotes e instala dependências básicas
        $SSH_COMMAND "sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg unzip"

        # Instala o Docker
        $SSH_COMMAND "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg && \
          sudo chmod a+r /etc/apt/keyrings/docker.gpg && \
          echo 'deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable' | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null && \
          sudo apt-get update && \
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin && \
          sudo usermod -aG docker $EC2_USER && \
          sudo systemctl enable docker && \
          sudo systemctl start docker"

        # Instala a AWS CLI v2
        $SSH_COMMAND "curl 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o 'awscliv2.zip' && \
          unzip -q awscliv2.zip && \
          sudo ./aws/install && \
          rm -rf aws awscliv2.zip"

        # Verifica se a instalação foi bem-sucedida
        $SSH_COMMAND "docker --version && aws --version"

        # Remove a chave PEM
        rm -f ec2.pem
        
    - name: Deploy to EC2
      env:
        EC2_PEM_KEY: ${{ secrets.EC2_PEM_KEY }}
        EC2_HOST: ${{ steps.tf_outputs.outputs.ec2_ip }}
        EC2_USER: ${{ secrets.EC2_USER }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fisiolates
        IMAGE_TAG: ${{ steps.next_version.outputs.tag }}
      run: |
        # Salva PEM
        echo "$EC2_PEM_KEY" > ec2.pem
        chmod 400 ec2.pem
    
        # Comandos SSH/SCP
        SSH_COMMAND="ssh -i ec2.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST"
        SCP_COMMAND="scp -i ec2.pem -o StrictHostKeyChecking=no"
    
        # Cria diretório no EC2 (se não existir)
        $SSH_COMMAND "mkdir -p /home/ubuntu/docker/ && sudo chown ubuntu:ubuntu /home/ubuntu/docker/"
    
        # Copia o compose.yaml
        $SCP_COMMAND compose.yaml .env $EC2_USER@$EC2_HOST:/home/ubuntu/docker/
    
        # Login no ECR
        $SSH_COMMAND "aws ecr get-login-password --region us-east-2 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY"
    
        # Pull da imagem e sobe os containers
        $SSH_COMMAND "cd /home/ubuntu/docker/ && \
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG && \
          docker compose -f compose.yaml up -d --force-recreate"
    
        # Remove PEM
        rm -f ec2.pem